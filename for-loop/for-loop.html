<html>

<head>
    <title>For Loop Example</title>
</head>

<body>
    <p id="demo"></p>
    <script>

        var i = 5;
        for (i = 0; i < 5; i++) {
        console.log("The number is: " + i);
        document.getElementById("demo").innerHTML += "The number is: " + i + "<br>";
        }


    </script>
</body>

</html>
