<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Dialogs Demo</title>
</head>
<body>
  <h2>Basic JavaScript Dialogs</h2>
  
  <button onclick="showAlert()">Show Alert</button>
  <button onclick="showPrompt()">Show Prompt</button>
  <button onclick="showConfirm()">Show Confirm</button>
  
  <p id="output"></p>

  <script>
    function showAlert() {
      alert("This is an alert message!");
      document.getElementById("output").textContent = "Alert shown!";
    }

    function showPrompt() {
      const name = prompt("What's your name?", "Guest");
      document.getElementById("output").textContent = 
        name ? `Hello, ${name}!` : "You didn't enter a name";
    }

    function showConfirm() {
      const answer = confirm("Do you like JavaScript?");
      document.getElementById("output").textContent = 
        answer ? "Great! " : "That's too bad ";
    }
  </script>
</body>
</html>
