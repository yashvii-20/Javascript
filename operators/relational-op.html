<!DOCTYPE html>
<html>
<head>
  <title>Relational Operators Example</title>
</head>
<body>
  <h2>Relational Operators in JavaScript</h2>
  <p id="demo1"></p>
  <p id="demo2"></p>
  <p id="demo3"></p>
  <p id="demo4"></p>
  <p id="demo5"></p>
  <p id="demo6"></p>
  <p id="demo7"></p>

  <script>
    let a = 10;
    let b = 5;
    let c = "10";

   
    document.getElementById("demo1").innerHTML = "a == c : " + (a == c);     
    document.getElementById("demo2").innerHTML = "a === c : " + (a === c);   
    document.getElementById("demo3").innerHTML = "a != b : " + (a != b);    
    document.getElementById("demo4").innerHTML = "a !== c : " + (a !== c);   
    document.getElementById("demo5").innerHTML = "a > b : " + (a > b);      
    document.getElementById("demo6").innerHTML = "a < b : " + (a < b);       
    document.getElementById("demo7").innerHTML = "a >= 10 && b <= 5 : " + (a >= 10 && b <= 5); 

</script>
</body>
</html>
