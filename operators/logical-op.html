<!DOCTYPE html>
<html>
<head>
  <title>Logical Operators Example</title>
</head>
<body>

<h2>Logical Operators Example</h2>

<p id="demo1"></p>
<p id="demo2"></p>
<p id="demo3"></p>

<script>
  let a = true;
  let b = false;

    //AND
  document.getElementById("demo1").innerHTML = "a && b = " + (a && b); 

  //OR
  document.getElementById("demo2").innerHTML = "a || b = " + (a || b);  

  //NOT
  document.getElementById("demo3").innerHTML = "!a = " + (!a);         
</script>

</body>
</html>
