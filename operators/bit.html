<!DOCTYPE html>
<html>

<head>
    <title>Bitwise Operations</title>
</head>

<body>
    <div>
        <form action="#" method="post" id="bitwise">
            <label for="A">A</label>
            <input type="number" id="A" name="A" placeholder="Enter number A" required><br><br>

            <label for="B">B</label>
            <input type="number" id="B" name="B" placeholder="Enter number B" required><br><br>

            <button type="submit">Enter</button>
            <div class="message" id="message" style="margin-top: 15px;"></div>
        </form>
    </div>

    <script>
        const i = document.getElementById("bitwise");
        let message = document.getElementById("message");

        i.addEventListener("submit", function (event) {
            event.preventDefault();

            var A = parseInt(document.getElementById("A").value);
            var B = parseInt(document.getElementById("B").value);

            while ( B!=0) {
                carry = (A & B)<<1;
                add = A ^ B;
                console.log("carry", carry);
                console.log("add", add);    
                A = add;    
                B = carry;
            }
           message.innerHTML= " your answer is"+A;  
            

            message.style.color = "darkblue";
        });
    </script>
</body>

</html>
