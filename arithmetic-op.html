<html>
    <head>
        <title>Arithmetic Operators</title>
        </head>
        <body><h1>Arithmetic Operators</h1>
            <p id="demo"></p>
             <p id="demo1"></p>
            <p id="demo2"></p>
            <p id="demo3"></p>
            <p id="demo4"></p>
            <script>
                var a,b,c;
                a = 5;
                b = 6;
                c = a+b;
                document.getElementById("demo").innerHTML = "Addition of a and b is: " + c;
                c = a-b;
                document.getElementById("demo1").innerHTML = "Substraction of a and b is: " +c;
                  c = a*b;
                document.getElementById("demo2").innerHTML = "Multiplication of a and b is: " +c; 
                 c = a/b;
                document.getElementById("demo3").innerHTML = "Division of a and b is: " +c; 
                 c = a%b;
                document.getElementById("demo4").innerHTML = "MOdulas of a and b is: " +c;
        
                
</script>
            </body>
            </html>
