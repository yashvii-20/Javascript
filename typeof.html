<html>
<head>
    <title>Type-OF-Operator</title>
</head>
<body>
    <h1>Type of Operator Example</h1>
    <script>
        let x = 10;
        let y = "Hello";
        let z = true;

        document.write("Type of x: " + typeof x + "<br>");
        document.write("Type of y: " + typeof y + "<br>");
        document.write("Type of z: " + typeof z + "<br>");
     
    </script>
</body>
</html>
