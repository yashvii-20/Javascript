<html>
<head>
  <title>instanceof Example</title>
</head>
<body>
  <script>
   var s = ["l", "e", "a", "r", "n"];
   document.write("s is an instance of Array: " + (s instanceof Array) + "<br>");
   document.write("s is an instance of Object: " + (s instanceof Number) + "<br>");
   </script>
</body>
</html>
